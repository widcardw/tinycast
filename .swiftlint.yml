included:
  - Tinycast

excluded:
  - Tinycast/Core/Emoji/EmojiData.generated.swift
  - Tinycast/Core/Calculator/CurrencyData.generated.swift

reporter: "github-actions-logging"

line_length:
  warning: 160
  error: 200
  ignores_comments: true
  ignores_urls: true

type_name:
  excluded:
    - ID

cyclomatic_complexity:
  warning: 45
  error: 60

function_body_length:
  warning: 130
  error: 200

function_parameter_count:
  warning: 9
  error: 12

type_body_length:
  warning: 720
  error: 900

file_length:
  warning: 1200
  error: 1500

nesting:
  type_level:
    warning: 2

disabled_rules:
  - force_cast
  - opening_brace
  - trailing_whitespace
  - identifier_name
  - optional_data_string_conversion
  - void_function_in_ternary
